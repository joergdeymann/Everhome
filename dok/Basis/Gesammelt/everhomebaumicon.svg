<svg xmlns="http://w3.org" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Hintergrund-Verlauf -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="40%" stop-color="#0d1f18"/>
      <stop offset="100%" stop-color="#050b08"/>
    </radialGradient>

    <!-- Leucht-Effekt (Filter) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Starker Leucht-Effekt -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Verläufe für magische Blätter -->
    <linearGradient id="cyanCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="goldGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed22e"/>
      <stop offset="100%" stop-color="#ff9a9e"/>
    </linearGradient>

    <!-- Verläufe für normale Blätter -->
    <linearGradient id="leafGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Holz-Struktur-Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c1a11"/>
      <stop offset="30%" stop-color="#4a3225"/>
      <stop offset="50%" stop-color="#5c3e31"/>
      <stop offset="70%" stop-color="#3d251a"/>
      <stop offset="100%" stop-color="#1f110a"/>
    </linearGradient>

    <!-- Einzelne Blattform Definition -->
    <path id="leafShape" d="M 0,0 C -15,-20 -15,-45 0,-60 C 15,-45 15,-20 0,0" />
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- WALDBODEN & WURZELN BASIS -->
  <g id="ground">
    <ellipse cx="400" cy="730" rx="380" ry="80" fill="#142217" />
    <path d="M 100,750 Q 250,710 400,730 T 700,750 L 800,800 L 0,800 Z" fill="#0d140f"/>
    <!-- Moos-Highlights auf dem Boden -->
    <ellipse cx="400" cy="720" rx="200" ry="30" fill="#22c55e" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- HINTERE KRONEN-SCHICHT (Dunkle Blätter) -->
  <g id="backCanopy" opacity="0.6">
    <circle cx="250" cy="250" r="120" fill="#064e3b" filter="url(#glow)"/>
    <circle cx="550" cy="250" r="120" fill="#064e3b" filter="url(#glow)"/>
    <circle cx="400" cy="180" r="140" fill="#022c22" filter="url(#glow)"/>
  </g>

  <!-- WURZELN (Vordergrund-Details) -->
  <g id="roots" stroke="url(#trunkGrad)" stroke-linecap="round" fill="none">
    <path d="M 350,650 Q 280,720 150,760" stroke-width="28"/>
    <path d="M 370,660 Q 320,740 220,780" stroke-width="20"/>
    <path d="M 450,650 Q 520,720 650,760" stroke-width="28"/>
    <path d="M 430,660 Q 480,740 580,780" stroke-width="22"/>
    <path d="M 400,670 Q 400,750 430,790" stroke-width="25"/>
    <path d="M 380,670 Q 370,750 340,790" stroke-width="18"/>
  </g>

  <!-- BAUMSTAMM -->
  <g id="trunk">
    <!-- Hauptstamm Form -->
    <path d="M 330,680 C 340,550 300,450 320,380 C 330,350 350,320 310,280 L 350,260 C 390,300 380,340 390,370 C 420,340 440,300 420,250 L 460,260 C 460,320 440,360 460,400 C 490,460 450,550 470,680 Z" fill="url(#trunkGrad)" />
    
    <!-- Organische Rindenfurchen / Linien -->
    <g stroke="#1a0f0a" stroke-width="4" fill="none" opacity="0.7">
      <path d="M 350,670 C 360,570 330,480 345,410 C 350,380 370,350 350,310" />
      <path d="M 450,670 C 440,580 455,500 435,430 C 425,390 405,360 415,320" />
      <path d="M 400,660 C 390,560 410,480 395,400" />
    </g>

    <!-- Magisches Portal / Rune im Stamm -->
    <ellipse cx="400" cy="580" rx="18" ry="30" fill="#050b08" stroke="#3d251a" stroke-width="4"/>
    <g filter="url(#strongGlow)">
      <!-- Leuchtende Rune -->
      <path d="M 400,560 L 400,600 M 400,570 L 412,560 M 400,570 L 388,560 M 400,590 L 412,600 M 400,590 L 388,600 M 385,580 L 415,580" stroke="#ffd700" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- HAUPTÄSTE UND SCHWÜNGE (SPIRALEN) -->
  <g id="branches" stroke="url(#trunkGrad)" stroke-linecap="round" fill="none">
    <!-- Linke Hauptäste -->
    <path d="M 330,420 C 250,400 180,450 120,400" stroke-width="20"/>
    <path d="M 320,380 C 220,340 180,250 220,180" stroke-width="16"/>
    
    <!-- Rechte Hauptäste -->
    <path d="M 465,430 C 550,420 620,480 690,430" stroke-width="20"/>
    <path d="M 460,370 C 550,340 580,240 540,180" stroke-width="16"/>

    <!-- Magische Schnörkel / Spiralen (Links - Cyan) -->
    <g stroke="url(#cyanCyan)" stroke-width="5" filter="url(#glow)">
      <path d="M 340,360 Q 280,320 260,260 A 40,40 0 1,0 220,280 R 20,20 0 1,0 240,290" />
      <path d="M 320,440 Q 220,430 180,490 A 30,30 0 1,1 140,450" />
      <path d="M 280,400 Q 200,360 140,320 A 35,35 0 1,0 160,260" />
      <path d="M 350,300 Q 300,200 360,150 A 25,25 0 1,1 390,190" />
    </g>

    <!-- Magische Schnörkel / Spiralen (Rechts - Gold) -->
    <g stroke="url(#goldGold)" stroke-width="5" filter="url(#glow)">
      <path d="M 460,360 Q 520,320 540,260 A 40,40 0 1,1 580,280 R 20,20 0 1,1 560,290" />
      <path d="M 480,440 Q 580,430 620,490 A 30,30 0 1,0 660,450" />
      <path d="M 520,400 Q 600,360 660,320 A 35,35 0 1,1 640,260" />
    </g>
  </g>

  <!-- NORMALE GRÜNE BLÄTTER (Dichte Krone im Äußeren) -->
  <g id="greenLeaves" fill="url(#leafGreen)">
    <!-- Links oben -->
    <use href="#leafShape" x="180" y="220" transform="rotate(-45 180 220) scale(0.8)"/>
    <use href="#leafShape" x="140" y="250" transform="rotate(-80 140 250) scale(0.9)"/>
    <use href="#leafShape" x="120" y="300" transform="rotate(-110 120 300) scale(1)"/>
    <use href="#leafShape" x="100" y="360" transform="rotate(-135 100 360) scale(0.9)"/>
    <use href="#leafShape" x="150" y="380" transform="rotate(-90 150 380) scale(0.7)"/>
    
    <use href="#leafShape" x="200" y="150" transform="rotate(-20 200 150) scale(0.9)"/>
    <use href="#leafShape" x="260" y="110" transform="rotate(0 260 110) scale(1)"/>
    <use href="#leafShape" x="320" y="90" transform="rotate(20 320 90) scale(1.1)"/>

    <!-- Mitte oben -->
    <use href="#leafShape" x="400" y="70" transform="rotate(45 400 70) scale(1.2)"/>
    <use href="#leafShape" x="460" y="80" transform="rotate(70 460 80) scale(1.1)"/>
    
    <!-- Rechts oben -->
    <use href="#leafShape" x="540" y="110" transform="rotate(90 540 110) scale(1)"/>
    <use href="#leafShape" x="600" y="150" transform="rotate(115 600 150) scale(0.9)"/>
    <use href="#leafShape" x="680" y="220" transform="rotate(135 680 220) scale(0.8)"/>
    <use href="#leafShape" x="660" y="290" transform="rotate(160 660 290) scale(1)"/>
    <use href="#leafShape" x="700" y="360" transform="rotate(180 700 360) scale(0.9)"/>
    <use href="#leafShape" x="650" y="410" transform="rotate(140 650 410) scale(0.7)"/>

    <!-- Untere herabhängende Büschel -->
    <use href="#leafShape" x="80" y="460" transform="rotate(-160 80 460) scale(0.8)"/>
    <use href="#leafShape" x="130" y="480" transform="rotate(-140 130 480) scale(0.7)"/>
    <use href="#leafShape" x="720" y="460" transform="rotate(160 720 460) scale(0.8)"/>
    <use href="#leafShape" x="670" y="480" transform="rotate(140 670 480) scale(0.7)"/>
  </g>

  <!-- LEUCHTENDE MAGISCHE BLÄTTER (Innenbereich) -->
  <!-- Linke Seite: Cyan/Blau Töne -->
  <g id="magicLeavesLeft" fill="url(#cyanCyan)" filter="url(#strongGlow)">
    <use href="#leafShape" x="230" y="280" transform="rotate(-30 230 280) scale(0.75)"/>
    <use href="#leafShape" x="180" y="330" transform="rotate(-65 180 330) scale(0.7)"/>
    <use href="#leafShape" x="210" y="400" transform="rotate(-100 210 400) scale(0.65)"/>
    <use href="#leafShape" x="290" y="250" transform="rotate(-15 290 250) scale(0.7)"/>
    <use href="#leafShape" x="270" y="350" transform="rotate(-45 270 350) scale(0.6)"/>
    <use href="#leafShape" x="330" y="210" transform="rotate(5 330 210) scale(0.8)"/>
    <use href="#leafShape" x="300" y="450" transform="rotate(-120 300 450) scale(0.55)"/>
  </g>

  <!-- Rechte Seite: Gold/Warm Töne -->
  <g id="magicLeavesRight" fill="url(#goldGold)" filter="url(#strongGlow)">
    <use href="#leafShape" x="570" y="280" transform="rotate(30 570 280) scale(0.75)"/>
    <use href="#leafShape" x="620" y="330" transform="rotate(65 620 330) scale(0.7)"/>
    <use href="#leafShape" x="590" y="400" transform="rotate(100 590 400) scale(0.65)"/>
    <use href="#leafShape" x="510" y="250" transform="rotate(15 510 250) scale(0.7)"/>
    <use href="#leafShape" x="530" y="350" transform="rotate(45 530 350) scale(0.6)"/>
    <use href="#leafShape" x="470" y="210" transform="rotate(-5 470 210) scale(0.8)"/>
    <use href="#leafShape" x="500" y="450" transform="rotate(120 500 450) scale(0.55)"/>
  </g>

    <!-- LICHTPUNKTE / FUNKEN (Glühwürmchen-Effekt) -->
  <g id="particles" filter="url(#strongGlow)">
    <!-- Cyan Partikel links -->
    <circle cx="200" cy="300" r="4" fill="#a5f3fc" />
    <circle cx="150" cy="420" r="3" fill="#e0f2fe" />
    <circle cx="280" cy="220" r="5" fill="#ecfeff" />
    <circle cx="260" cy="480" r="3.5" fill="#67e8f9" />
    <circle cx="320" cy="310" r="2" fill="#fff" />
    <circle cx="110" cy="520" r="4" fill="#22d3ee" />

    <!-- Goldene Partikel rechts -->
    <circle cx="600" cy="300" r="4" fill="#fef08a" />
    <circle cx="650" cy="420" r="3" fill="#fefcbf" />
    <circle cx="520" cy="220" r="5" fill="#fffdec" />
    <circle cx="540" cy="480" r="3.5" fill="#fde047" />
    <circle cx="480" cy="310" r="2" fill="#fff" />
    <circle cx="690" cy="520" r="4" fill="#facc15" />
    
    <!-- Um den Stamm und in der Luft -->
    <circle cx="400" cy="480" r="3" fill="#fef08a" />
    <circle cx="370" cy="530" r="2.5" fill="#e0f2fe" />
    <circle cx="440" cy="620" r="3.5" fill="#fde047" />
    <circle cx="340" cy="640" r="2" fill="#67e8f9" />
  </g>

  <!-- BODEN-PILZE (Kleine Details am Stammfuß) -->
  <g id="mushrooms" fill="#e2e8f0" stroke="#475569" stroke-width="1">
    <!-- Pilze links -->
    <path d="M 310,660 Q 310,645 300,645 Q 290,645 290,660 Z" fill="#94a3b8"/>
    <path d="M 305,675 Q 305,665 295,665 Q 285,665 285,675 Z" fill="#cbd5e1"/>
    <!-- Pilze rechts -->
    <path d="M 490,650 Q 490,640 500,640 Q 510,640 510,650 Z" fill="#94a3b8"/>
    <path d="M 485,665 Q 485,658 492,658 Q 500,658 500,665 Z" fill="#cbd5e1"/>
  </g>
</svg>
